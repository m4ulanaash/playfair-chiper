<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playfair Cipher</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header class="app-header">
            <h1 class="app-title">Playfair Cipher</h1>
            <p class="app-description">Aplikasi Enkripsi dan Dekripsi Teks menggunakan Algoritma Playfair Cipher</p>
        </header>

        <main class="app-main">
            <!-- Mode Selection -->
            <section class="mode-section">
                <button id="encryptMode" class="mode-btn active">Enkripsi</button>
                <button id="decryptMode" class="mode-btn">Dekripsi</button>
            </section>

            <!-- Key & Text Input Section -->
            <section class="input-section">
                <div class="form-group">
                    <label for="key" class="form-label">Kunci (Key):</label>
                    <input type="text" id="key" class="input-field" placeholder="Masukkan kata kunci">
                </div>

                <div class="form-group">
                    <label for="inputText" class="form-label">Teks Input:</label>
                    <textarea id="inputText" class="input-textarea" rows="5"
                        placeholder="Masukkan teks yang ingin diproses..."></textarea>
                </div>

                <div class="form-group file-group">
                    <label for="file" class="file-label">Upload File (.txt):</label>
                    <input type="file" id="file" class="input-file" accept=".txt">
                    <span id="filename" class="file-name"></span>
                </div>
            </section>

            <!-- Error Message Alert -->
            <div id="error" class="error-message" style="display:none"></div>

            <!-- Action Buttons -->
            <section class="action-section">
                <button id="process" class="btn btn-primary">Proses</button>
                <button id="clear" class="btn btn-secondary">Bersihkan</button>
            </section>

            <!-- Result Section -->
            <section id="result" class="result-section" style="display:none">
                <h2 class="result-title">Hasil Proses</h2>

                <div class="result-grid-container">
                    <div class="square-wrapper">
                        <h3>Matriks Kunci 5x5</h3>
                        <div id="square" class="key-square"></div>
                    </div>

                    <div class="pairs-wrapper">
                        <h3>Pasangan Huruf (Digraf)</h3>
                        <div id="pairs" class="pairs-container"></div>
                    </div>
                </div>

                <div class="output-wrapper">
                    <label for="output" class="form-label">Teks Hasil:</label>
                    <textarea id="output" class="output-textarea" rows="5" readonly></textarea>
                </div>

                <div class="download-wrapper">
                    <button id="download" class="btn btn-success">Download Hasil</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Script dependencies -->
    <script src="js/playfair.js"></script>
    <script src="js/input.js"></script>
    <script src="js/output.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
